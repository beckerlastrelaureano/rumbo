name: Avisos de Rumbo

# Revisa cada 15 minutos si hay que mandar avisos (objetivos pendientes y resumen del domingo).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13 web-push@3
      - run: node scripts/avisos.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
