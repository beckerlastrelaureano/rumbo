<script type="module">
// Sincronización con la nube (Firebase), con la misma cuenta que Becker App.
// Los datos siguen en el celular (localStorage); con la cuenta iniciada se copian a
// usuarios/{uid}/rumbo/{clave} y se leen los entrenamientos de usuarios/{uid}/becker…
// Cada clave se compara con la última versión sincronizada ("base"): si cambió un solo lado,
// gana ese lado; si cambiaron los dos, se unen (listas por id y objetos por clave).
// Configuración pública de la app web en Firebase (proyecto "becker-sync", la misma que Becker App).
// No es secreta: la seguridad la dan el inicio de sesión y las reglas de Firestore.
const CONFIG = {
  apiKey: "AIzaSyD9CG3aFhpSl_waa1GyqUvoDYtG7k7yG7o",
  authDomain: "becker-sync.firebaseapp.com",
  projectId: "becker-sync",
  storageBucket: "becker-sync.firebasestorage.app",
  messagingSenderId: "277639910408",
  appId: "1:277639910408:web:a84fbd7556582d9b4aedbd",
};
const KEYS = ["pilares", "profile", "habits", "logs", "nutrition", "checkins", "ritual", "wheel", "agenda", "finance", "exercises", "workoutLogs", "goals", "notes", "weekPlan", "disciplina", "rumbo.avisos", "rumbo.becker"];
const estado = { disponible: !!CONFIG, user: null, estado: "apagado", error: "", ultima: 0, hayCambios: false };
const emitir = () => window.dispatchEvent(new CustomEvent("rumbo-sync", { detail: { ...estado } }));
let fb = null, refs = null, remotos = {}, unsub = [], timer = null, aplicando = false;
const arranque = Date.now();

const ls = {
  get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { aplicando = true; v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} finally { aplicando = false; } },
};
const baseKey = () => `rumbo.sync.base.${estado.user.uid}`;
const getBase = () => { try { return JSON.parse(ls.get(baseKey())) || {}; } catch (e) { return {}; } };
const setBase = (b) => ls.set(baseKey(), JSON.stringify(b));

function unir(a, b) {
  if (Array.isArray(a) && Array.isArray(b)) {
    if (!a.concat(b).every((x) => x && typeof x === "object" && "id" in x)) return a;
    const m = new Map(b.map((x) => [x.id, x]));
    a.forEach((x) => m.set(x.id, x));
    return [...m.values()];
  }
  if (a && b && typeof a === "object" && typeof b === "object" && !Array.isArray(a) && !Array.isArray(b)) {
    const out = { ...b };
    for (const k of Object.keys(a)) out[k] = k in b ? unir(a[k], b[k]) : a[k];
    return out;
  }
  return a;
}
function resolver(k, L, R, base) {
  if (R == null) return L;
  if (L == null) return R;
  if (base[k] != null && L === base[k]) return R;
  if (base[k] != null && R === base[k]) return L;
  try { return JSON.stringify(unir(JSON.parse(L), JSON.parse(R))); } catch (e) { return L; }
}

async function firebase() {
  if (fb) return fb;
  const [app, auth, fs] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js"),
  ]);
  const a = app.initializeApp(CONFIG);
  fb = { auth: auth.getAuth(a), A: auth, store: fs.getFirestore(a), fs };
  return fb;
}
function mensaje(err) {
  const c = (err && err.code) || "";
  if (/invalid-credential|wrong-password|user-not-found/.test(c)) return "Email o contraseña incorrectos.";
  if (c.includes("email-already-in-use")) return "Ya hay una cuenta con ese email: usá Entrar.";
  if (c.includes("weak-password")) return "La contraseña tiene que tener al menos 6 caracteres.";
  if (c.includes("invalid-email")) return "El email no es válido.";
  if (/network|unavailable/.test(c)) return "Sin conexión. Se sincroniza cuando vuelva internet.";
  if (c.includes("permission")) return "La nube rechazó el acceso (permisos).";
  if (c.includes("too-many-requests")) return "Demasiados intentos. Esperá un rato.";
  return "No se pudo sincronizar. Probá de nuevo.";
}
const set = (p) => { Object.assign(estado, p); emitir(); };

// Aplica lo que vino de la nube. Rumbo lee sus datos al abrir, así que si algo cambió hay que
// recargar: al abrir se recarga solo; después se ofrece un botón para no cortar lo que se está haciendo.
function aplicarRemotos() {
  const base = getBase();
  let cambio = false;
  for (const k of KEYS) {
    const L = ls.get(k), R = remotos[k] ?? null;
    const v = resolver(k, L, R, base);
    if (v !== L) { ls.set(k, v); cambio = true; }
    if (R != null && v === R) base[k] = R;
  }
  setBase(base);
  if (cambio) {
    if (Date.now() - arranque < 8000) location.reload();
    else set({ hayCambios: true });
  }
  programar();
}
async function subir() {
  if (!refs) return;
  const { fs } = fb;
  const base = getBase();
  try {
    for (const k of KEYS) {
      const v = ls.get(k);
      if (v == null || v === remotos[k]) continue;
      await fs.setDoc(fs.doc(refs.rumbo, k), { value: v, updatedAt: Date.now() });
      remotos[k] = v; base[k] = v;
    }
    setBase(base);
    set({ estado: "ok", ultima: Date.now(), error: "" });
  } catch (err) { set({ estado: "error", error: mensaje(err) }); }
}
function programar() { if (refs) { clearTimeout(timer); timer = setTimeout(subir, 1500); } }

// Entrenamientos y rutinas de Becker App, para la tarjeta de Entreno.
const BECKER_CLOUD = "rumbo.beckerCloud";
const fecha = (t) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
let beckerEstado = null, beckerSes = new Map();
function guardarBecker() {
  const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
  const nombres = beckerEstado ? beckerEstado.nombres || {} : {};
  let plan = [];
  try {
    const e = beckerEstado ? JSON.parse(beckerEstado.json) : null;
    const items = (its) => its.map((it) => ({ nombre: nombres[it.exId] || "Ejercicio", detalle: `${it.sets} × ${it.reps}${it.kg != null ? ` · ${Math.round(it.kg * 10) / 10} kg` : ""}` }));
    plan = (e ? e.rutinas : []).flatMap((r) => (r.dias
      ? r.dias.map((d) => ({ nombre: `${r.nombre} · ${d.nombre}`, dia: d.dia, ejercicios: items(d.items) }))
      : [{ nombre: r.nombre, dia: r.dia, ejercicios: items(r.items) }])).filter((u) => u.dia != null && u.ejercicios.length);
  } catch (e) {}
  const sesiones = [...beckerSes.values()].sort((a, b) => b.fin - a.fin).slice(0, 60).map((s) => {
    const n = { ...nombres, ...(s.nombres || {}) };
    const done = s.ejercicios.flatMap((e) => e.series);
    return {
      fecha: fecha(s.fin), nombre: s.nombre, minutos: Math.max(1, Math.round((s.fin - s.inicio) / 6e4)), series: done.length,
      volumen: Math.round(done.reduce((a, x) => a + (x.kg && x.reps ? x.kg * x.reps : 0), 0)),
      ejercicios: s.ejercicios.map((e) => ({ nombre: n[e.exId] || "Ejercicio", series: e.series.map((x) => `${x.kg ? Math.round(x.kg * 10) / 10 : "—"}×${x.reps}${x.rir != null ? ` RIR${x.rir}` : ""}${x.rpe != null ? ` @${x.rpe}` : ""}`).join(" · ") })),
    };
  });
  ls.set(BECKER_CLOUD, JSON.stringify({ plan, sesiones, dias: DIAS, actualizado: Date.now() }));
  window.dispatchEvent(new Event("rumbo-becker"));
}

async function empezar(user) {
  const { store, fs } = await firebase();
  set({ user: { uid: user.uid, email: user.email }, estado: "conectando", error: "" });
  refs = { rumbo: fs.collection(store, "usuarios", user.uid, "rumbo") };
  const becker = { estado: fs.doc(store, "usuarios", user.uid, "becker", "estado"), sesiones: fs.query(fs.collection(store, "usuarios", user.uid, "becker_sesiones"), fs.orderBy("fin", "desc"), fs.limit(60)) };
  try {
    const snap = await fs.getDocs(refs.rumbo);
    remotos = {};
    snap.forEach((d) => { remotos[d.id] = d.data().value; });
    aplicarRemotos();
    await subir();
  } catch (err) { set({ estado: "error", error: mensaje(err) }); }
  unsub.push(fs.onSnapshot(refs.rumbo, (snap) => {
    if (snap.metadata.hasPendingWrites) return;
    let cambio = false;
    snap.docChanges().forEach((c) => {
      const v = c.type === "removed" ? undefined : c.doc.data().value;
      if (remotos[c.doc.id] !== v) { remotos[c.doc.id] = v; cambio = true; }
    });
    if (cambio) aplicarRemotos();
  }, (err) => set({ estado: "error", error: mensaje(err) })));
  unsub.push(fs.onSnapshot(becker.estado, (s) => { beckerEstado = s.exists() ? s.data() : null; guardarBecker(); }, () => {}));
  unsub.push(fs.onSnapshot(becker.sesiones, (s) => {
    beckerSes = new Map();
    s.forEach((d) => { try { beckerSes.set(d.id, { ...JSON.parse(d.data().json), nombres: d.data().nombres }); } catch (e) {} });
    guardarBecker();
  }, () => {}));
}

// Cada vez que Rumbo guarda algo de la lista, se sube a la nube (con una pequeña espera).
const setOriginal = Storage.prototype.setItem;
Storage.prototype.setItem = function (k, v) {
  setOriginal.call(this, k, v);
  if (!aplicando && this === localStorage && KEYS.includes(k)) programar();
};

window.rumboSync = {
  estado: () => ({ ...estado }),
  async entrar(email, pass, crear) {
    const { auth, A } = await firebase();
    set({ error: "" });
    try { await (crear ? A.createUserWithEmailAndPassword : A.signInWithEmailAndPassword)(auth, email.trim(), pass); return true; }
    catch (err) { set({ error: mensaje(err) }); return false; }
  },
  async salir() { const { auth, A } = await firebase(); await A.signOut(auth); },
  async recuperar(email) {
    const { auth, A } = await firebase();
    try { await A.sendPasswordResetEmail(auth, email.trim()); return true; } catch (err) { set({ error: mensaje(err) }); return false; }
  },
  recargar: () => location.reload(),
};
if (CONFIG) {
  firebase().then(({ auth, A }) => A.onAuthStateChanged(auth, (user) => {
    unsub.forEach((u) => u()); unsub = []; refs = null; remotos = {};
    if (user) empezar(user);
    else { ls.set(BECKER_CLOUD, null); window.dispatchEvent(new Event("rumbo-becker")); set({ user: null, estado: "apagado", error: "" }); }
  })).catch(() => set({ estado: "error", error: "No se pudo cargar la nube (¿sin internet?)." }));
  window.addEventListener("online", programar);
}
emitir();
</script>
