<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rumbo</title>

<!-- PWA: hace que se pueda instalar en el celular como una app -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#12141F" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rumbo" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<!-- Tailwind precompilado localmente (sin CDN, funciona sin internet) -->
<link rel="stylesheet" href="tailwind.min.css" />

<!-- Tipografías (si no hay internet, cae a las fuentes del sistema) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<!-- React + ReactDOM alojados localmente (sin CDN, funciona sin internet) -->
<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #12141F; }
  @keyframes confetti-fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(70vh) rotate(360deg); opacity: 0; }
  }
  input::placeholder, textarea::placeholder { color: #5D6178; }
  * { -webkit-tap-highlight-color: transparent; }
</style>

<!-- Diagnóstico: si algo no carga, lo muestra en pantalla en vez de dejar todo en negro -->
<script>
  function showBootError(msg) {
    var el = document.getElementById("root");
    if (el) {
      el.innerHTML =
        '<div style="min-height:100vh;padding:24px;color:#E27D6B;font-family:monospace;font-size:13px;white-space:pre-wrap;line-height:1.5;">⚠️ Rumbo no pudo cargar\n\n' +
        msg +
        "</div>";
    }
  }
  window.addEventListener("error", function (e) {
    showBootError((e.error && e.error.stack) || e.message || "Error desconocido");
  });
  window.addEventListener("unhandledrejection", function (e) {
    showBootError(String((e.reason && e.reason.stack) || e.reason));
  });
  window.addEventListener("load", function () {
    setTimeout(function () {
      if (!window.React || !window.ReactDOM) {
        showBootError(
          "No se pudo cargar React o ReactDOM.\n\n" +
            "Estos archivos (react.production.min.js y react-dom.production.min.js) tienen que estar " +
            "en la MISMA carpeta que rumbo.html. Revisá que se hayan copiado bien.\n\n" +
            "React: " + (window.React ? "cargó bien" : "NO CARGÓ") + "\n" +
            "ReactDOM: " + (window.ReactDOM ? "cargó bien" : "NO CARGÓ")
        );
      }
    }, 2000);
  });
  // Registra el service worker para que la app funcione instalada y sin conexión
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
</script>
</head>
